
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Battle IA PRO - V1.4</title>
    <style>
        body { background-color: #0d0d0d; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; }
        .menu-container { max-width: 400px; margin: auto; border: 2px solid #28a745; padding: 15px; border-radius: 15px; background: #1a1a1a; }
        h1 { color: #28a745; margin-bottom: 5px; }
        #monedas-display { color: #ffc107; font-weight: bold; margin: 10px 0; }
        
        /* Teclado Pro */
        .teclado { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 20px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .tecla { background: #444; padding: 10px 0; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.2em; border: none; color: white; }
        .tecla.incorrecta { background: #1a1a1a; color: #333; cursor: not-allowed; opacity: 0.5; }
        .tecla.correcta { background: #28a745; }
        .tecla.presente { background: #ffc107; color: black; }
        
        .btn-dificultad { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; font-weight: bold; color: white; }
        .facil { background: #28a745; } .normal { background: #007bff; } .dificil { background: #dc3545; }
        #panel-admin { display: none; color: #ffc107; border: 1px solid #ffc107; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="menu-container" id="menu-principal">
    <h1>WORDLE IA PRO</h1>
    <div id="monedas-display">MIS MONEDAS: $0</div>
    <button class="btn-dificultad facil" onclick="iniciarJuego(8)">FÁCIL (8 Intentos)</button>
    <button class="btn-dificultad normal" onclick="iniciarJuego(6)">NORMAL (6 Intentos)</button>
    <button class="btn-dificultad dificil" onclick="iniciarJuego(4)">DIFÍCIL (4 Intentos)</button>
    
    <div style="margin-top:20px;">
        <input type="text" id="input-codigo" placeholder="Código regalo..." style="padding:8px; width:50%;">
        <button onclick="canjearCodigo()" style="padding:8px; background:#28a745; border:none; color:white;">OK</button>
    </div>
    <button onclick="accesoDesarrollador()" style="background:none; border:none; color:#333; font-size:0.7em; margin-top:10px;">[ DESARROLLADORES ]</button>
    <div id="panel-admin">CÓDIGO: <span id="codigo-revelado"></span></div>
</div>

<div id="juego" style="display:none;">
    <h2 id="msg-dificultad"></h2>
    <div id="tablero"></div>
    <div class="teclado" id="teclado-virtual"></div>
    <button onclick="volverMenu()" style="margin-top:20px; background:#444; color:white; border:none; padding:10px;">Volver</button>
</div>

<script>
    let monedas = parseInt(localStorage.getItem('monedas')) || 0;
    const claveAdmin = "poweradmin5678"; // Tu clave segura
    let letrasBloqueadas = [];

    function actualizarMarcador() {
        document.getElementById('monedas-display').innerText = "MIS MONEDAS: $" + monedas;
    }

    function iniciarJuego(intentos) {
        document.getElementById('menu-principal').style.display = 'none';
        document.getElementById('juego').style.display = 'block';
        document.getElementById('msg-dificultad').innerText = "Intentos: " + intentos;
        letrasBloqueadas = [];
        generarTeclado();
    }

    function generarTeclado() {
        const letras = "QWERTYUIOPASDFGHJKLZXCVBNM".split("");
        const tecladoDiv = document.getElementById('teclado-virtual');
        tecladoDiv.innerHTML = "";
        
        letras.forEach(letra => {
            const btn = document.createElement('button');
            btn.innerText = letra;
            btn.id = "tecla-" + letra;
            btn.className = "tecla";
            btn.onclick = () => procesarLetra(letra);
            tecladoDiv.appendChild(btn);
        });
    }

    function procesarLetra(letra) {
        if (letrasBloqueadas.includes(letra)) return; // No permite escribir si está bloqueada

        // --- LÓGICA DE PRUEBA DE BLOQUEO ---
        // Aquí simulamos que si la letra no está, se bloquea
        // En tu lógica real, esto pasaría después de comparar la palabra
        const esCorrecta = Math.random() > 0.5; 

        if (!esCorrecta) {
            document.getElementById("tecla-" + letra).classList.add("incorrecta");
            letrasBloqueadas.push(letra); // La añade a la lista negra
        } else {
            document.getElementById("tecla-" + letra).classList.add("correcta");
        }
    }

    function accesoDesarrollador() {
        const pass = prompt("Contraseña:");
        if (pass === claveAdmin) {
            document.getElementById('panel-admin').style.display = "block";
            document.getElementById('codigo-revelado').innerText = "GIFT" + (new Date().getDate() * 12);
        }
    }

    function volverMenu() {
        document.getElementById('menu-principal').style.display = 'block';
        document.getElementById('juego').style.display = 'none';
    }

    window.onload = actualizarMarcador;
</script>
</body>
</html>
