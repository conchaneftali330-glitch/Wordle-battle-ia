<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Battle IA PRO - V1.6</title>
    <style>
        body { background-color: #0d0d0d; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; }
        .menu-container { max-width: 400px; margin: auto; border: 2px solid #28a745; padding: 15px; border-radius: 15px; background: #1a1a1a; }
        #monedas-display { color: #ffc107; font-weight: bold; margin: 10px 0; }
        
        /* TABLERO DE CUADRITOS */
        .grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; max-width: 300px; margin: 20px auto; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile { width: 100%; height: 50px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 1.5em; font-weight: bold; text-transform: uppercase; background: #111; }
        
        .teclado { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; max-width: 500px; margin: 20px auto; }
        .tecla { background: #444; padding: 12px 0; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; border: none; }
        .btn-enviar { grid-column: span 2; background: #28a745; }
        .btn-borrar { grid-column: span 2; background: #dc3545; }
        
        #turno-display { background: #ffc107; color: black; padding: 10px; font-weight: bold; border-radius: 5px; margin-bottom: 10px; display: none; }
        .btn-dificultad { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; font-weight: bold; color: white; cursor: pointer; }
        .facil { background: #28a745; } .normal { background: #007bff; } .dificil { background: #dc3545; } .batalla { background: #9b59b6; }
    </style>
</head>
<body>

<div class="menu-container" id="menu-principal">
    <h1>WORDLE IA PRO</h1>
    <div id="monedas-display">MIS MONEDAS: $0</div>
    <button class="btn-dificultad facil" onclick="iniciarJuego(8, 'SOLO')">FÁCIL (8 Intentos)</button>
    <button class="btn-dificultad normal" onclick="iniciarJuego(6, 'SOLO')">NORMAL (6 Intentos)</button>
    <button class="btn-dificultad dificil" onclick="iniciarJuego(4, 'SOLO')">DIFÍCIL (4 Intentos)</button>
    <button class="btn-dificultad batalla" onclick="iniciarJuego(6, 'BATTLE')">⚔️ MODO BATALLA</button>
</div>

<div id="juego" style="display:none;">
    <div id="turno-display">TURNO: JUGADOR 1</div>
    <div class="grid" id="tablero"></div>
    <div class="teclado" id="teclado-virtual"></div>
    <button onclick="location.reload()" style="margin-top:20px; background:#444; color:white; border:none; padding:10px;">Salir</button>
</div>

<script>
    let monedas = parseInt(localStorage.getItem('monedas')) || 0;
    let modoJuego = 'SOLO';
    let intentosMax = 6;
    let intentoActual = 0;
    let letraActual = 0;
    let palabraDelDia = "JUEGO"; // Aquí podrías poner una lista aleatoria
    let turnoJugador = 1;

    function iniciarJuego(intentos, modo) {
        modoJuego = modo;
        intentosMax = intentos;
        document.getElementById('menu-principal').style.display = 'none';
        document.getElementById('juego').style.display = 'block';
        
        if(modo === 'BATTLE') document.getElementById('turno-display').style.display = 'block';
        
        generarTablero();
        generarTeclado();
        actualizarMarcador();
    }

    function generarTablero() {
        const tablero = document.getElementById('tablero');
        tablero.innerHTML = "";
        for (let i = 0; i < intentosMax; i++) {
            let row = document.createElement("div");
            row.className = "row";
            for (let j = 0; j < 5; j++) {
                let tile = document.createElement("div");
                tile.className = "tile";
                tile.id = `t-${i}-${j}`;
                row.appendChild(tile);
            }
            tablero.appendChild(row);
        }
    }

    function generarTeclado() {
        const letras = "QWERTYUIOPASDFGHJKLZXCVBNM".split("");
        const tecladoDiv = document.getElementById('teclado-virtual');
        tecladoDiv.innerHTML = "";
        letras.forEach(l => {
            const b = document.createElement('button');
            b.innerText = l; b.className = "tecla";
            b.onclick = () => escribirLetra(l);
            tecladoDiv.appendChild(b);
        });
        // Botón Borrar
        const btnB = document.createElement('button');
        btnB.innerText = "DEL"; btnB.className = "tecla btn-borrar";
        btnB.onclick = borrarLetra;
        tecladoDiv.appendChild(btnB);
        // Botón Enviar
        const btnE = document.createElement('button');
        btnE.innerText = "ENTER"; btnE.className = "tecla btn-enviar";
        btnE.onclick = enviarPalabra;
        tecladoDiv.appendChild(btnE);
    }

    function escribirLetra(l) {
        if (letraActual < 5) {
            document.getElementById(`t-${intentoActual}-${letraActual}`).innerText = l;
            letraActual++;
        }
    }

    function borrarLetra() {
        if (letraActual > 0) {
            letraActual--;
            document.getElementById(`t-${intentoActual}-${letraActual}`).innerText = "";
        }
    }

    function enviarPalabra() {
        if (letraActual === 5) {
            // Aquí iría la lógica de colores (verde/amarillo/gris)
            
            if (modoJuego === 'BATTLE') {
                turnoJugador = (turnoJugador === 1) ? 2 : 1;
                const td = document.getElementById('turno-display');
                td.innerText = "TURNO: JUGADOR " + turnoJugador;
                td.style.background = (turnoJugador === 1) ? "#ffc107" : "#007bff";
                alert("Cambio de turno. ¡Le toca al siguiente!");
            }
            
            intentoActual++;
            letraActual = 0;
            if (intentoActual >= intentosMax) alert("Fin del juego");
        } else {
            alert("Faltan letras");
        }
    }

    function actualizarMarcador() {
        document.getElementById('monedas-display').innerText = "MIS MONEDAS: $" + monedas;
    }
</script>
</body>
</html>
